# ==========================================
# PROMETHEUS METRICS SCRAPE CONFIGURATION
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Host Node Metrics (CPU, RAM, Disk, Load)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 2. Docker Container Metrics (CPU/RAM per container)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Spring Boot Backend Metrics (JVM, Garbage Collection, HTTP Latency)
  - job_name: 'spring-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
