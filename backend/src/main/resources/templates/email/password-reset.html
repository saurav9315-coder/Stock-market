<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Password Reset Request</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .card { background: #161b22; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #30363d; }
        .btn { display: inline-block; padding: 12px 20px; background: #da3633; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #f85149;">Password Reset Request</h2>
        <p>Hello <strong th:text="${username}">User</strong>,</p>
        <p>We received a request to reset your password. Click the link below to set a new password:</p>
        <p><a th:href="${resetUrl}" class="btn">Reset Password</a></p>
        <p>If you did not request a password reset, please ignore this email.</p>
    </div>
</body>
</html>
