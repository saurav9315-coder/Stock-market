spring:
  # Database Configuration for Testing (using in-memory H2)
  datasource:
    url: jdbc:h2:mem:stockdb_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: TestHikariCP
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000

  # JPA & Hibernate Settings for Test
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Automatically manage test schemas
    show-sql: false

  # Redis Configuration for Test
  data:
    redis:
      host: ${REDIS_TEST_HOST:localhost}
      port: ${REDIS_TEST_PORT:6379}
      repositories:
        enabled: false

  # Flyway configuration for Test
  flyway:
    enabled: false # Disable Flyway during JPA unit tests, database created by Hibernate create-drop

app:
  websocket:
    redis-pubsub:
      enabled: false

logging:
  level:
    root: WARN
    com.stock.analysis: DEBUG

management:
  health:
    defaults:
      enabled: false
    redis:
      enabled: false
