<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Verify Your Email</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .card { background: #161b22; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #30363d; }
        .code { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #58a6ff; background: #0d1117; padding: 10px 20px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #58a6ff;">Email Verification Code</h2>
        <p>Hello <strong th:text="${username}">User</strong>,</p>
        <p>Please use the following verification token to verify your email address:</p>
        <p><span class="code" th:text="${verificationToken}">123456</span></p>
        <p>This code will expire in 15 minutes.</p>
    </div>
</body>
</html>
