<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Withdrawal Status Update</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .card { background: #161b22; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #d29922;">Withdrawal Status Update</h2>
        <p>Hello <strong th:text="${username}">Trader</strong>,</p>
        <p th:text="${message}">Your withdrawal request has been updated.</p>
        <p>Amount: <strong th:text="${amount}">$0.00</strong></p>
    </div>
</body>
</html>
