version: '3.8'

services:
  # --- POSTGRESQL DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_db}
      POSTGRES_USER: ${POSTGRES_USER:-stock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePostgresPassword2026!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_user} -d ${POSTGRES_DB:-stock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- REDIS CACHE & PUBSUB ---
  redis:
    image: redis:7-alpine
    container_name: stock-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-SuperSecureRedisPassword2026!} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-SuperSecureRedisPassword2026!} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- SPRING BOOT BACKEND SERVICE ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stock_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stock_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePostgresPassword2026!}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-SuperSecureRedisPassword2026!}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dGhpc0lzQVNlY3JldEtleUZvckpXVENyZWF0aW9uQW5kVmFsaWRhdGlvbkludGVncmF0aW9uVGVzdHMxMjM0NTY=}
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MS: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - backend-logs:/app/logs
    networks:
      - stock-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- NEXT.JS FRONTEND SERVICE ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost/ws-stomp
    networks:
      - stock-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- NGINX REVERSE PROXY ---
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: stock-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - nginx-logs:/var/log/nginx
    networks:
      - stock-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stock-network:
    name: stock-network
    driver: bridge

volumes:
  postgres-data:
    name: stock-postgres-data
  redis-data:
    name: stock-redis-data
  backend-logs:
    name: stock-backend-logs
  nginx-logs:
    name: stock-nginx-logs
