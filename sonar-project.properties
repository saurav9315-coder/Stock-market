# ==========================================
# SONARQUBE PROJECT CONFIGURATION
# ==========================================

sonar.projectKey=stock-market-analysis-platform
sonar.projectName=Stock Market Analysis Platform
sonar.projectVersion=1.0.0-SNAPSHOT

# --- SOURCE ENCODING & LANGUAGE ---
sonar.sourceEncoding=UTF-8
sonar.sources=src,backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes

# --- COVERAGE REPORTING ---
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- EXCLUSIONS ---
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.d.ts,\
  **/*.json,\
  **/node_modules/**,\
  **/.next/**,\
  **/target/**,\
  **/generated-sources/**
