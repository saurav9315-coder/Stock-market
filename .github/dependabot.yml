# ==========================================
# DEPENDABOT AUTOMATED DEPENDENCY UPDATES
# ==========================================

version: 2
updates:
  # --- MAVEN BACKEND DEPENDENCIES ---
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
      - "java"

  # --- NPM FRONTEND DEPENDENCIES ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"

  # --- GITHUB ACTIONS WORKFLOWS ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"

  # --- DOCKER CONTAINERS ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
