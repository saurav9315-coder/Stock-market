name: Release Preparation & Artifact Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  package-release:
    name: Package Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Backend JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Build Frontend Standalone Bundle
        run: |
          npm ci
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Package Deployment Archive
        run: |
          mkdir -p release-bundle
          cp docker-compose.yml release-bundle/
          cp .env.example release-bundle/
          cp -r nginx release-bundle/
          cp -r scripts release-bundle/
          cp backend/target/*.jar release-bundle/stock-backend.jar
          zip -r release-bundle-${{ github.ref_name }}.zip release-bundle/

      - name: Generate Release Notes & Create GitHub Release Draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-bundle-${{ github.ref_name }}.zip
            backend/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
